#
# On every pull request, checks the dependencies it adds or changes against GitHub's advisory
# database and fails if any has a known vulnerability (moderate or worse), so a vulnerable
# package can't be merged unnoticed. Mostly catches Dependabot or hand-made dependency PRs.

name: Dependency review

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
