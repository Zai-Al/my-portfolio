#
# Supabase pauses free projects after about a week without activity, which takes the
# whole site down. Pinging /health (it checks the database) every two days prevents that.
# It also wakes the Render backend, though Render will sleep again after ~15 minutes.

name: Keep alive

on:
  schedule:
    - cron: "17 6 */2 * *" # 06:17 UTC every second day
  workflow_dispatch: # allow a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        # Render can take ~1 minute to wake up, so allow a long timeout and a few retries.
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 30 --retry-all-errors \
            https://zainab-alawi-portfolio.onrender.com/health
